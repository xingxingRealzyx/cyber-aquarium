name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
            arch: x64
            command: package:win
          - platform: macos
            runner: macos-15
            arch: arm64
            command: package:mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.command }}
      - name: Verify packaged Windows WebGL renderer
        if: runner.os == 'Windows'
        run: |
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-Table
          node scripts/smoke-packaged-render.mjs "release/Cyber Aquarium-win32-x64/Cyber Aquarium.exe" --allow-ci-software
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: release/Cyber-Aquarium-${{ matrix.platform }}-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error
